<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Портал групи</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        nav {
            padding: 15px;
            margin-bottom: 30px;
            border-bottom: 1px solid #ccc;
        }

        nav a {
            margin-right: 15px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }

        input,
        textarea {
            padding: 8px;
            margin: 5px 0;
        }

        img {
            max-width: 200px;
        }

        .message {
            padding: 10px;
            margin-bottom: 15px;
            background: #e8f5e9;
        }
    </style>
</head>

<body>

<nav>
    <a href="{% url 'home' %}">Головна</a>

    {% if user.is_authenticated %}
        <a href="{% url 'profile' %}">Профіль</a>

        <a href="{% url 'profile_edit' %}">
            Редагувати профіль
        </a>

        <form
            method="post"
            action="{% url 'logout' %}"
            style="display: inline;"
        >
            {% csrf_token %}
            <button type="submit">
                Вийти
            </button>
        </form>
    {% else %}
        <a href="{% url 'login' %}">
            Увійти
        </a>

        <a href="{% url 'register' %}">
            Реєстрація
        </a>
    {% endif %}
</nav>


{% if messages %}
    {% for message in messages %}
        <div class="message">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}


{% block content %}
{% endblock %}

</body>
</html>
