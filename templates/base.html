{% load static %}

<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}MonoBank{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<header>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand fw-bold" href="#">
                MonoBank
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" href="#">Головна</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Форум</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Події</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Матеріали</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Портфоліо</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Галерея</a>
                    </li>

                </ul>

                <ul class="navbar-nav">

                    {% if user.is_authenticated %}

                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                Профіль
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                Вийти
                            </a>
                        </li>

                    {% else %}

                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                Вхід
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="btn btn-primary ms-lg-2" href="#">
                                Реєстрація
                            </a>
                        </li>

                    {% endif %}

                </ul>

            </div>

        </div>

    </nav>

</header>


<main>

    {% block content %}

    {% endblock %}

</main>


<footer>
    <!-- Footer поки що залишаємо -->
</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
