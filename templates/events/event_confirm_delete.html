{% extends 'base.html' %}

{% block title %}
Видалення події | MonoBank
{% endblock %}

{% block content %}

<div class="container py-5 event-delete-page">

    <div class="card event-delete-card">

        <div class="card-body p-4 p-md-5 text-center">

            <div class="event-delete-icon">
                !
            </div>

            <h1 class="event-delete-title">
                Видалити подію?
            </h1>

            <p class="event-delete-text">
                Ви дійсно хочете видалити подію
                <strong>«{{ event.title }}»</strong>?
            </p>

            <p class="text-muted">
                Цю дію неможливо скасувати.
            </p>


            <form method="post">

                {% csrf_token %}

                <div class="event-delete-actions">

                    <button
                        type="submit"
                        class="btn btn-danger"
                    >
                        Так, видалити
                    </button>

                    <a
                        href="{% url 'event_detail' event.pk %}"
                        class="btn btn-outline-secondary"
                    >
                        Скасувати
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
