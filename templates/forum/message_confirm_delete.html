{% extends 'base.html' %}

{% block title %}Видалення повідомлення{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card">

                <div class="card-body">

                    <h2 class="card-title mb-3">
                        Видалити повідомлення?
                    </h2>

                    <p>
                        Ви дійсно хочете видалити це повідомлення?
                    </p>

                    <div class="alert alert-secondary">
                        {{ object.text }}
                    </div>


                    <form method="post">

                        {% csrf_token %}

                        <button
                            type="submit"
                            class="btn btn-danger"
                        >
                            Так, видалити
                        </button>

                        <a
                            href="{% url 'forum:topic_detail' object.topic.pk %}"
                            class="btn btn-secondary"
                        >
                            Скасувати
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
